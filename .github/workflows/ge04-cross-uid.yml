name: GE-04 cross-UID isolation (manual security gate)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-uid-denial:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.11.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Run real distinct-UID filesystem denial (skip is forbidden)
        shell: bash
        run: |
          set -euo pipefail
          sudo -n env PATH="$PATH" node --test dist/tests/execution/filesystem/ge04-distinct-uid-denial.test.js | tee /tmp/ge04-cross-uid-test.log
          if grep -Eq '(skipped|# SKIP|ℹ skipped [1-9])' /tmp/ge04-cross-uid-test.log; then
            echo 'GE-04 security gate failed: test skipped' >&2
            exit 1
          fi
          grep -Eq 'pass 1|ℹ pass 1' /tmp/ge04-cross-uid-test.log
