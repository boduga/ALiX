name: OpenTUI native checks

on:
  pull_request:
    paths:
      - 'experiments/opentui/**'
      - 'src/interfaces/tui/workbench/opentui/**'
      - 'src/interfaces/tui/workbench/layout/**'
      - 'src/interfaces/tui/workbench/views/composer-view.ts'
      - 'src/interfaces/tui/workbench/render/terminal-text.ts'
      - 'src/interfaces/tui/workbench/model/ui-state.ts'
      - 'tests/tui/workbench/opentui-layout.native.ts'
      - 'tests/tui/workbench/opentui-host.native.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/opentui-spike.yml'
  workflow_dispatch:

# P4.3-Sf.4: Explicit least-privilege permissions
permissions:
  contents: read

jobs:
  native-core:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 26.4.0
          - os: ubuntu-latest
            node: 26.11.0
          - os: ubuntu-24.04-arm
            node: 26.11.0
          - os: macos-15-intel
            node: 26.11.0
          - os: macos-latest
            node: 26.11.0
          - os: windows-latest
            node: 26.11.0
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      # actions/checkout v7.0.1 — pinned SHA (matches ci.yml)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # Intel macOS previously had a pnpm 11 executable compatibility issue.
      # This lane now tests pnpm installation explicitly rather than falling
      # back to a second package manager.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          version: 11
      # actions/setup-node v7.0.0 — pinned SHA (matches ci.yml)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - if: matrix.os != 'macos-15-intel'
        run: pnpm install --frozen-lockfile
      - if: matrix.os != 'macos-15-intel'
        run: pnpm build
      - if: matrix.os != 'macos-15-intel'
        run: pnpm test:opentui
      - name: Production renderer PTY check
        if: runner.os != 'Windows' && matrix.os != 'macos-15-intel'
        run: python3 scripts/opentui-pty-check.py
      - run: pnpm --dir experiments/opentui install --frozen-lockfile
      - run: pnpm --dir experiments/opentui test
      # PTY check needs fcntl/termios/openpty and is Unix-only. Windows native
      # load and in-memory render are covered by `pnpm test`; Windows terminal
      # restoration is covered below via a pywinpty/ConPTY check.
      - name: Terminal restoration
        if: runner.os != 'Windows'
        run: pnpm --dir experiments/opentui test:pty
      - name: Terminal restoration (Windows ConPTY)
        if: runner.os == 'Windows'
        run: |
          python -m pip install --quiet pywinpty
          python experiments/opentui/pty-check-win.py
