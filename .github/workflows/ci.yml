name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# P4.3-Sf.4: Explicit least-privilege permissions
permissions:
  contents: read

jobs:
  # ─── Lane 0: Supply-chain check (first gate) ──────────────────────────
  supply-chain:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout v4 — pinned SHA
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # pnpm/action-setup — pinned SHA, install pnpm before setup-node for cache:pnpm
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          version: 11
      # actions/setup-node v4 — pinned SHA
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "26.11.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Lifecycle script check (Sf.1)
        run: node scripts/verify-lifecycle-scripts.mjs
      - name: Lockfile integrity (Sf.3)
        run: |
          if ! git diff --exit-code pnpm-lock.yaml; then
            echo "ERROR: pnpm-lock.yaml has uncommitted changes"
            exit 1
          fi
          echo "Lockfile clean — OK"
      - name: Package manager policy check
        run: bash scripts/check-package-manager.sh
      - name: Exact-pin check (verify:deps)
        run: pnpm verify:deps
      - name: Supply-chain gate (Sf.x)
        run: bash scripts/check-supply-chain.sh
      - name: Packaged CLI smoke
        run: |
          PACK_JSON="$(pnpm pack --json --pack-destination "$RUNNER_TEMP")"
          TARBALL="$(printf '%s' "$PACK_JSON" | node -p "const parsed = JSON.parse(require('fs').readFileSync('/dev/stdin', 'utf8')); (Array.isArray(parsed) ? parsed[0] : parsed).filename")"
          SMOKE_DIR="$(mktemp -d)"
          npm install --prefix "$SMOKE_DIR" --no-audit --no-fund "$TARBALL"
          (cd "$SMOKE_DIR" && ./node_modules/.bin/alix init && ./node_modules/.bin/alix doctor && ./node_modules/.bin/alix models doctor --json)

  # ─── Lane 1: TypeScript typecheck (fast, no build needed) ─────────────
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          version: 11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "26.11.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: TypeScript typecheck
        run: pnpm typecheck
      - name: TypeScript unused check (src; #718)
        run: pnpm typecheck:unused

  # ─── Lane 1b: DOX claim/code audit (git-only, no install) ─────────────────
  # A contract line a branch ADDS to any AGENTS.md must be backed by that
  # branch's own content. This is the gate that caught a doc claiming functions
  # which only existed on a sibling branch.
  dox-claims:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout v4 — pinned SHA
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The audit diffs the PR against its base, so the base must be present.
          # A shallow (depth-1) checkout leaves it unresolvable and the script
          # exits 2 rather than treating an unresolved base as an empty diff.
          fetch-depth: 0
      # actions/setup-node v4 — pinned SHA
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "26.11.0"
      - name: DOX claim/code audit
        run: node scripts/check-dox-claims.mjs --base "${{ github.event.pull_request.base.sha || 'main' }}"
      # A reference that no longer describes the tree reads as coverage that does
      # not exist. Offline-only: $schema refs, root-relative doc paths, and
      # exception-entry shape. Expiry and advisory matching belong to the
      # supply-chain gate, not here.
      - name: Staleness audit (references still resolve)
        run: node scripts/check-staleness.mjs

  # ─── Lane 2: Unit tests (vitest) ──────────────────────────────────────────
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          version: 11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "26.11.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Vitest
        # Hard cap so a stalled suite fails fast with its output (GitHub captures
        # the log on timeout) instead of hanging to the 6h job timeout with no
        # diagnostic. The suite runs serially (fileParallelism:false) and takes
        # ~3-4 min on CI; 15 min is generous headroom.
        timeout-minutes: 15
        run: pnpm test:vitest

  # ─── Lane 7: Live provider model-list validation ─────────────────────────
  # Runs after `unit`. Per-provider `describe.skipIf(!env.X)` in
  # tests/cli/helpers/init-live.vitest.ts gates each suite individually
  # (spec §17). Job runs even without secrets — empty envs simply skip.
  test-live:
    needs: unit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          version: 11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "26.11.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Live provider model list validation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
        run: pnpm test:vitest -- tests/cli/helpers/init-live.vitest.ts

  # ─── Lane 3: Integration + Soak Tier 1 + Doctor ───────────────────────
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          version: 11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "26.11.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Integration tests
        run: pnpm test:integration
      - name: Soak Tier 1 (corruption + store load + memory + daemon resources)
        run: pnpm test:soak:quick
      - name: Doctor health check
        run: node dist/src/cli.js doctor

  # ─── Lane 4: TUI smoke (blocking) ─────────────────────────────────────
  tui-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          version: 11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "26.11.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: TUI manual smoke
        run: pnpm test:manual:tui

  # ─── Lane 5: Cross-platform — macOS (minimum + tested Node) ──────────
  unit-macos:
    strategy:
      matrix:
        node-version: ["26.4.0", "26.11.0"]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          version: 11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: TypeScript typecheck
        run: pnpm typecheck
      - name: Vitest (#693 — exercise macOS filesystem/process semantics)
        run: pnpm test:vitest

  # ─── Lane 6: Cross-platform — Windows (supported Node runtime) ───────
  unit-windows:
    strategy:
      matrix:
        node-version: ["26.11.0"]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          version: 11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        shell: bash
        run: pnpm build
      - name: TypeScript typecheck
        shell: bash
        run: pnpm typecheck
      - name: Vitest (#693 — exercise Windows filesystem/process semantics)
        shell: bash
        run: pnpm test:vitest

  # ─── Lane 8: Benchmark boundedness + retrieval_precision thresholds (#645) ─
  # Single tracer bullet — encodes POC boundedness properties as hard CI gates.
  # Fails the PR if context grows with horizon or precision drops.
  # Covered by `tests/benchmark-thresholds.vitest.ts` (also in `unit` lane);
  # this lane gives the gate its own status check for visibility.
  benchmark-thresholds:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          version: 11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "26.11.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Boundedness + retrieval_precision thresholds (#645)
        run: npx vitest run tests/benchmark-thresholds.vitest.ts --config vitest.config.mts

  # ─── Lane 9: node:test suite (unit-level, non-vitest) ────────────────
  # Covers the ~6500 node:test tests the vitest unit lane never runs
  # (566 files under dist/tests, excluding integration/soak/pty/manual/
  # skills/slow-repomap — those have their own lanes).
  #
  # Requires `pnpm build` (tsc + copy-build-artifacts): a tsc-only rebuild
  # misses non-TS artifacts (config profiles, UI assets, SQL migrations)
  # that several suites need, causing spurious ENOENT failures.
  #
  # Blocking gate (#690): failures here fail the workflow. The one known
  # environment-dependent flake (fresh-install-onboarding credential
  # resolution against the operator's real ~/.config) was fixed by
  # isolating HOME in that suite. If new flakes surface, quarantine the
  # specific file with a linked issue rather than re-adding
  # continue-on-error to the whole lane.
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          version: 11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "26.11.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: node:test suite
        run: pnpm test:node:ci

  # ─── Lane 10: Coverage signal (#694) ─────────────────────────────────
  # Runs the repaired `pnpm test:coverage` (node:test CI set + vitest
  # scope file) and publishes the summary to the job summary + artifacts.
  # Informational gate: fails only if measurement itself breaks (no
  # thresholds configured yet).
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          version: 11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "26.11.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Coverage measurement
        run: pnpm test:coverage
      - name: Publish coverage summary
        if: always()
        run: |
          {
            echo "## Coverage summary"
            echo '```'
            npx c8 report --reporter=text 2>/dev/null | tail -n 8
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # actions/upload-artifact v4 — pinned SHA
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: coverage
          path: coverage/coverage-summary.json

  # F-4: macOS does not ship util-linux flock; exercise portable daemon admission.
  daemon-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "26.11.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # D9 Phase F: exercise portable mkdir-lock admission, successor publication,
      # real process crash/recovery and approval/continuation authority on macOS.
      # Keep this a required job; a Linux pass is not a substitute for macOS evidence.
      - name: Daemon admission, stop/restart and successor publication
        timeout-minutes: 8
        run: |
          node --test --test-isolation=none \
            dist/tests/daemon/daemon-manager.test.js \
            dist/tests/daemon/daemon-stop-publication.test.js
      - name: Continuation authority, process races and SIGKILL recovery
        timeout-minutes: 12
        run: |
          node --test --test-isolation=none \
            dist/tests/security/d9-process-races.test.js \
            dist/tests/security/d9-resumer-sigkill.test.js
      - name: Focused continuation security acceptance
        timeout-minutes: 8
        run: |
          ./node_modules/.bin/vitest run --configLoader native --config vitest.config.mts \
            --pool=forks --maxWorkers=1 \
            tests/security/daemon-tool-continuation-acceptance.vitest.ts \
            tests/security/worker-approval-port.vitest.ts \
            tests/security/continuation-cancellation.vitest.ts \
            tests/security/continuation-unknown-outcome.vitest.ts

  # GE-04 experimental branch-only security gate. Runs only for the unmerged
  # GE-04 PR, never as a production deployment or blanket privileged test.
  ge04-cross-uid-denial:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/ge04-linux-backend-adapter'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.11.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Verify distinct-UID denial without skips
        shell: bash
        run: |
          set -euo pipefail
          sudo -n env PATH="$PATH" node --test dist/tests/execution/filesystem/ge04-distinct-uid-denial.test.js | tee /tmp/ge04-cross-uid-test.log
          grep -Eq '^[[:space:]]*ℹ tests 1[[:space:]]*$' /tmp/ge04-cross-uid-test.log
          grep -Eq '^[[:space:]]*ℹ pass 1[[:space:]]*$' /tmp/ge04-cross-uid-test.log
          grep -Eq '^[[:space:]]*ℹ fail 0[[:space:]]*$' /tmp/ge04-cross-uid-test.log
          grep -Eq '^[[:space:]]*ℹ skipped 0[[:space:]]*$' /tmp/ge04-cross-uid-test.log
      - name: Verify GE04 supervisor evidence denial with real distinct UID
        shell: bash
        run: |
          set -euo pipefail
          sudo -n env PATH="$PATH" python3 -B experiments/ge04/test-supervisor-distinct-uid.py | tee /tmp/ge04-supervisor-uid.log
          grep -Fq 'GE04 distinct-UID supervisor evidence denial PASS' /tmp/ge04-supervisor-uid.log
      - name: Prepare isolated GE04 signing-test Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated signing-test dependency
        run: python -m pip install cryptography==43.0.3
      - name: Verify GE04 signed installation with real distinct UID
        shell: bash
        run: |
          set -euo pipefail
          python -B experiments/ge04/test-signed-release.py
          python -B experiments/ge04/test-signed-installation.py
          python -B experiments/ge04/test-supervisor-trust-config.py
          python -B experiments/ge04/test-trusted-path.py
          sudo -n env PATH="$PATH" "$(command -v python)" -B experiments/ge04/test-trusted-path-root.py | tee /tmp/ge04-trusted-path.log
          grep -Fq 'GE04 trusted ancestry root PASS' /tmp/ge04-trusted-path.log
          sudo -n env PATH="$PATH" "$(command -v python)" -B experiments/ge04/test-trusted-release-root.py | tee /tmp/ge04-trusted-release.log
          grep -Fq 'GE04 trusted release descriptor PASS' /tmp/ge04-trusted-release.log
          sudo -n env PATH="$PATH" "$(command -v python)" -B experiments/ge04/test-atomic-release-root.py | tee /tmp/ge04-atomic-generation.log
          grep -Fq 'GE04 atomic generations root PASS' /tmp/ge04-atomic-generation.log
          sudo -n env PATH="$PATH" "$(command -v python)" -B experiments/ge04/test-release-floor-root.py | tee /tmp/ge04-release-floor.log
          grep -Fq 'GE04 protected floor root PASS' /tmp/ge04-release-floor.log
          sudo -n env PATH="$PATH" "$(command -v python)" -B experiments/ge04/test-signed-sequence-root.py | tee /tmp/ge04-signed-sequence.log
          grep -Fq 'GE04 signed sequence root PASS' /tmp/ge04-signed-sequence.log
          sudo -n env PATH="$PATH" "$(command -v python)" -B experiments/ge04/test-pinned-sequence-root.py | tee /tmp/ge04-pinned-sequence.log
          grep -Fq 'GE04 pinned sequence root PASS' /tmp/ge04-pinned-sequence.log
          sudo -n env PATH="$PATH" "$(command -v python)" -B experiments/ge04/test-floor-advance-root.py | tee /tmp/ge04-floor-advance.log
          grep -Fq 'GE04 floor advancement root PASS' /tmp/ge04-floor-advance.log
          sudo -n env PATH="$PATH" "$(command -v python)" -B experiments/ge04/test-floor-concurrency-root.py | tee /tmp/ge04-floor-concurrency.log
          grep -Fq 'GE04 floor concurrency root PASS' /tmp/ge04-floor-concurrency.log
          sudo -n env PATH="$PATH" "$(command -v python)" -B experiments/ge04/test-floor-locked-verification-root.py | tee /tmp/ge04-floor-locked.log
          grep -Fq 'GE04 locked verification root PASS' /tmp/ge04-floor-locked.log
          sudo -n env PATH="$PATH" "$(command -v python)" -B experiments/ge04/test-floor-interruption-root.py | tee /tmp/ge04-floor-interruption.log
          grep -Fq 'GE04 floor interruption root PASS' /tmp/ge04-floor-interruption.log
          sudo -n env PATH="$PATH" "$(command -v python)" -B experiments/ge04/test-supervisor-ledger-root.py | tee /tmp/ge04-supervisor-ledger.log
          grep -Fq 'GE04 supervisor ledger root PASS' /tmp/ge04-supervisor-ledger.log
          sudo -n env PATH="$PATH" "$(command -v python)" -B experiments/ge04/test-supervisor-denial-root.py | tee /tmp/ge04-supervisor-denial.log
          grep -Fq 'GE04 supervisor denial root PASS' /tmp/ge04-supervisor-denial.log
          sudo -n env PATH="$PATH" "$(command -v python)" -B experiments/ge04/test-supervisor-denial-concurrency-root.py | tee /tmp/ge04-supervisor-denial-concurrency.log
          grep -Fq 'GE04 denial concurrency/process-crash PASS' /tmp/ge04-supervisor-denial-concurrency.log
          python3 -B experiments/ge04/test-sealed-memfd-exec.py | tee /tmp/ge04-sealed-memfd.log
          grep -Fq 'GE-04 sealed memfd proof PASS' /tmp/ge04-sealed-memfd.log
          "$(command -v python)" -B experiments/ge04/test-signed-sealed-installation.py | tee /tmp/ge04-signed-sealed.log
          grep -Fq 'GE04 signed-to-sealed snapshot PASS' /tmp/ge04-signed-sealed.log
          sudo -n env PATH="$PATH" "$(command -v python)" -B experiments/ge04/test-signed-release-root.py | tee /tmp/ge04-signed-install.log
          grep -Fq 'GE04 signed installation distinct-UID PASS' /tmp/ge04-signed-install.log
          sudo -n env PATH="$PATH" "$(command -v python)" -B experiments/ge04/test-trusted-supervisor-preparation-root.py | tee /tmp/ge04-trusted-preparation.log
          grep -Fq 'GE04 trusted supervisor preparation PASS' /tmp/ge04-trusted-preparation.log
          python3 -B experiments/ge04/test-clone3-pidfd-lifecycle.py | tee /tmp/ge04-sup02-pidfd.log
          grep -Fq 'GE04 SUP-02 pidfd lifecycle PASS' /tmp/ge04-sup02-pidfd.log
          sudo -n env PATH="$PATH" "$(command -v python)" -B experiments/ge04/test-supervisor-unverified-evidence-root.py | tee /tmp/ge04-sup03-unverified.log
          grep -Fq 'GE04 SUP-03 unverified evidence PASS' /tmp/ge04-sup03-unverified.log
          python3 -B experiments/ge04/test-pidfd-attempt-observation.py | tee /tmp/ge04-sup04-pidfd-attempt.log
          grep -Fq 'GE04 SUP-04 pidfd attempt binding PASS' /tmp/ge04-sup04-pidfd-attempt.log
          "$(command -v python)" -B experiments/ge04/test-signed-authority-claim.py | tee /tmp/ge04-sup05-claim.log
          grep -Fq 'GE04 SUP-05 signed claim matching PASS' /tmp/ge04-sup05-claim.log
