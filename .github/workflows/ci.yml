name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# P4.3-Sf.4: Explicit least-privilege permissions
permissions:
  contents: read

jobs:
  # ─── Lane 0: Supply-chain check (first gate) ──────────────────────────
  supply-chain:
    runs-on: ubuntu-latest
    # Hard cap. Without one, a resolver that stops converging occupies a runner
    # until the 6-hour org limit and surfaces as a hang with no diagnosis.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # actions/checkout v4 — pinned SHA
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # pnpm/action-setup — pinned SHA, install pnpm before setup-node for cache:pnpm
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          version: 11
      # actions/setup-node v4 — pinned SHA
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "26.11.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Lifecycle script check (Sf.1)
        run: node scripts/verify-lifecycle-scripts.mjs
      - name: Lockfile integrity (Sf.3)
        run: |
          if ! git diff --exit-code pnpm-lock.yaml; then
            echo "ERROR: pnpm-lock.yaml has uncommitted changes"
            exit 1
          fi
          echo "Lockfile clean — OK"
      - name: Package manager policy check
        run: bash scripts/check-package-manager.sh
      - name: Exact-pin check (verify:deps)
        run: pnpm verify:deps
      - name: Internal supervisor naming guard
        run: pnpm check:internal-naming
      - name: Supply-chain gate (Sf.x)
        run: bash scripts/check-supply-chain.sh
      # Installs the packed tarball the way a USER does — `npm install` — so this
      # lane exercises the documented `npm install -g alix` resolution path, not
      # pnpm's. The dependency set is npm-resolvable by construction; see the
      # OTel peer pins in package.json (they exist because @langfuse/otel declares
      # required peers that npm must satisfy, unlike pnpm).
      #
      # Each phase is individually bounded so a stall names itself instead of
      # consuming the job budget. Observed cold-cache install: ~70s.
      - name: Packaged CLI smoke
        run: |
          set -euo pipefail
          PACK_JSON="$(timeout 180 pnpm pack --json --pack-destination "$RUNNER_TEMP")"
          TARBALL="$(printf '%s' "$PACK_JSON" | node -p "const parsed = JSON.parse(require('fs').readFileSync('/dev/stdin', 'utf8')); (Array.isArray(parsed) ? parsed[0] : parsed).filename")"
          SMOKE_DIR="$(mktemp -d)"
          echo "::group::install tarball ($TARBALL)"
          if ! timeout 600 npm install --prefix "$SMOKE_DIR" --no-audit --no-fund "$TARBALL"; then
            echo "::endgroup::"
            echo "ERROR: tarball install failed or exceeded 600s" >&2
            exit 1
          fi
          echo "::endgroup::"
          set +e
          INSTALL_FAIL=0
          for cmd in init doctor "models doctor --json"; do
            echo "::group::alix $cmd"
            # shellcheck disable=SC2086  # deliberate word splitting for the arg list
            (cd "$SMOKE_DIR" && timeout 180 ./node_modules/.bin/alix $cmd)
            rc=$?
            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then
              echo "ERROR: 'alix $cmd' failed (exit $rc)" >&2
              INSTALL_FAIL=1
            fi
          done
          exit "$INSTALL_FAIL"

  # ─── Lane 1: TypeScript typecheck (fast, no build needed) ─────────────
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          version: 11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "26.11.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: TypeScript typecheck
        run: pnpm typecheck
      - name: TypeScript unused check (src; #718)
        run: pnpm typecheck:unused

  # ─── Lane 1b: DOX claim/code audit (git-only, no install) ─────────────────
  # A contract line a branch ADDS to any AGENTS.md must be backed by that
  # branch's own content. This is the gate that caught a doc claiming functions
  # which only existed on a sibling branch.
  dox-claims:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout v4 — pinned SHA
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The audit diffs the PR against its base, so the base must be present.
          # A shallow (depth-1) checkout leaves it unresolvable and the script
          # exits 2 rather than treating an unresolved base as an empty diff.
          fetch-depth: 0
      # actions/setup-node v4 — pinned SHA
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "26.11.0"
      - name: DOX claim/code audit
        run: node scripts/check-dox-claims.mjs --base "${{ github.event.pull_request.base.sha || 'main' }}"
      # A reference that no longer describes the tree reads as coverage that does
      # not exist. Offline-only: $schema refs, root-relative doc paths, and
      # exception-entry shape. Expiry and advisory matching belong to the
      # supply-chain gate, not here.
      - name: Staleness audit (references still resolve)
        run: node scripts/check-staleness.mjs
      # Evidence provenance: an artifact must postdate the thing it describes,
      # and must not move in the same commit as its own generator. The failure
      # this catches is edit-generator-edit-artifact-commit-both, which makes
      # every content comparison agree with itself.
      #
      # Pins first. Every gate below is only as trustworthy as the script that
      # computes it, and a script can be edited to pass in the same commit as the
      # thing it judges. These hashes make that edit a visible workflow change
      # instead of a one-line tweak hidden inside a diff. The limit is stated
      # plainly: a commit author can edit the script and this pin together, so
      # this is a cost and a review signal, not cryptographic independence.
      - name: Checker script pins (sha256)
        run: |
          set -eu
          sha256sum --check --strict <<'PINS'
          32bc75d5e105c172a166e75505f4d5e309452ea519fab956e69284aec2e0a4d7  scripts/check-evidence-integrity.mjs
          1c4fc7df2755ba6dff8570043700bded21d7bd5ea744b429c48f0b04b3582c2b  scripts/check-dox-claims.mjs
          4e070c37815eeb36cabd7c48e49093247282d3f924dad4598c13b3178296550a  scripts/check-staleness.mjs
          40653f0b76f9c0684dbab0a4878fa9b2d84c1b16628326baaf903415700f59a6  scripts/check-pr-scope.mjs
          0f275052da81f607fb7f917a0bd78cbc18673a40f20eee78360cc10a6ddbe3c2  scripts/check-review-evidence.mjs
          05a72536ee398f380264e739c9ad2ca0fcbe8384ea926de4d2015d85ee28a921  scripts/preflight.mjs
          cc75448b1135983034c296e48bc97650933ba6c3303b8751ded1b01ab05c6c62  .githooks/pre-push
          PINS
      #
      # Two steps on purpose. The strict run reaches a real verdict
      # (`pass_with_accepted`), so a green check means something. The second
      # step reports `pass_with_declared_skips` rather than an unqualified pass,
      # so the declared-non-reproducible set stays visible in the run's verdict
      # instead of being absorbed into "OK".
      - name: Evidence provenance (order, markers, coverage)
        run: node scripts/check-evidence-integrity.mjs --max-accepted 2
      # Gating on what it can actually prove. A generator that declares itself
      # reproducible is re-run and drift fails the build. The four current
      # generators declare `recompute: false` (each records a machine state or a
      # paid model run that no longer exists), so their artifacts are hash-pinned
      # and order-checked but not regenerated.
      #
      # `not_checked` exits 1 on its own. `--max-recompute-skipped 4` bounds the
      # exemption set shrink-only, and `--allow-declared-skips` is the explicit
      # acknowledgement of exactly that bounded set: it turns the run into
      # `pass_with_declared_skips`, never an unqualified `pass`. The flag is
      # narrower than an acknowledgement of the run: it applies only when every
      # unchecked reason is a declared skip AND the run recorded zero blocking
      # findings, so it can never upgrade a verdict that already failed. Any
      # other unchecked reason — pending commits, an empty manifest — still fails.
      # When a generator becomes reproducible, this step starts reproducing it
      # and the pin must drop.
      - name: Evidence recompute (4 acknowledged declared-non-reproducible generators)
        run: node scripts/check-evidence-integrity.mjs --max-accepted 2 --recompute --max-recompute-skipped 4 --allow-declared-skips

  # ─── Lane 1c: preflight regression tests ─────────────────────────────────
  # `pnpm preflight` is what the pre-push hook runs, so its own verdicts need
  # parity coverage. The suite is plain node:test with no install, and it
  # builds throwaway fixtures instead of asserting on this checkout.
  preflight-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "26.11.0"
      - name: Verify preflight selection and scope verdicts
        run: node --test tests/scripts/preflight.test.mjs tests/scripts/check-pr-scope.test.mjs tests/scripts/check-review-evidence.test.mjs tests/scripts/pre-push.test.mjs

  # ─── Lane 2: Unit tests (vitest) ──────────────────────────────────────────
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          version: 11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "26.11.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Vitest
        # Hard cap so a stalled suite fails fast with its output (GitHub captures
        # the log on timeout) instead of hanging to the 6h job timeout with no
        # diagnostic. The suite runs serially (fileParallelism:false) and takes
        # ~3-4 min on CI; 15 min is generous headroom.
        timeout-minutes: 15
        run: pnpm test:vitest

  # ─── Lane 7: Live provider model-list validation ─────────────────────────
  # Runs after `unit`. Per-provider `describe.skipIf(!env.X)` in
  # tests/cli/helpers/init-live.vitest.ts gates each suite individually
  # (spec §17). Job runs even without secrets — empty envs simply skip.
  test-live:
    needs: unit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          version: 11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "26.11.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Live provider model list validation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
        run: pnpm test:vitest -- tests/cli/helpers/init-live.vitest.ts

  # ─── Lane 3: Integration + Soak Tier 1 + Doctor ───────────────────────
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          version: 11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "26.11.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Integration tests
        run: pnpm test:integration
      - name: Soak Tier 1 (corruption + store load + memory + daemon resources)
        run: pnpm test:soak:quick
      - name: Doctor health check
        run: node dist/src/cli.js doctor

  # ─── Lane 4: TUI smoke (blocking) ─────────────────────────────────────
  tui-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          version: 11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "26.11.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: TUI manual smoke
        run: pnpm test:manual:tui

  # ─── Lane 5: Cross-platform — macOS (minimum + tested Node) ──────────
  unit-macos:
    strategy:
      matrix:
        node-version: ["26.4.0", "26.11.0"]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          version: 11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: TypeScript typecheck
        run: pnpm typecheck
      - name: Vitest (#693 — exercise macOS filesystem/process semantics)
        run: pnpm test:vitest

  # ─── Lane 6: Cross-platform — Windows (supported Node runtime) ───────
  unit-windows:
    strategy:
      matrix:
        node-version: ["26.11.0"]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          version: 11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        shell: bash
        run: pnpm build
      - name: TypeScript typecheck
        shell: bash
        run: pnpm typecheck
      - name: Vitest (#693 — exercise Windows filesystem/process semantics)
        shell: bash
        run: pnpm test:vitest

  # ─── Lane 8: Benchmark boundedness + retrieval_precision thresholds (#645) ─
  # Single tracer bullet — encodes POC boundedness properties as hard CI gates.
  # Fails the PR if context grows with horizon or precision drops.
  # Covered by `tests/benchmark-thresholds.vitest.ts` (also in `unit` lane);
  # this lane gives the gate its own status check for visibility.
  benchmark-thresholds:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          version: 11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "26.11.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Boundedness + retrieval_precision thresholds (#645)
        run: pnpm exec vitest run tests/benchmark-thresholds.vitest.ts --config vitest.config.mts

  # ─── Lane 9: node:test suite (unit-level, non-vitest) ────────────────
  # Covers the ~6500 node:test tests the vitest unit lane never runs
  # (566 files under dist/tests, excluding integration/soak/pty/manual/
  # skills/slow-repomap — those have their own lanes).
  #
  # Requires `pnpm build` (tsc + copy-build-artifacts): a tsc-only rebuild
  # misses non-TS artifacts (config profiles, UI assets, SQL migrations)
  # that several suites need, causing spurious ENOENT failures.
  #
  # Blocking gate (#690): failures here fail the workflow. The one known
  # environment-dependent flake (fresh-install-onboarding credential
  # resolution against the operator's real ~/.config) was fixed by
  # isolating HOME in that suite. If new flakes surface, quarantine the
  # specific file with a linked issue rather than re-adding
  # continue-on-error to the whole lane.
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          version: 11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "26.11.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: node:test suite
        run: pnpm test:node:ci

  # ─── Lane 10: Coverage signal (#694) ─────────────────────────────────
  # Runs the repaired `pnpm test:coverage` (node:test CI set + vitest
  # scope file) and publishes the summary to the job summary + artifacts.
  # Informational gate: fails only if measurement itself breaks (no
  # thresholds configured yet).
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          version: 11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "26.11.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Coverage measurement
        run: pnpm test:coverage
      - name: Publish coverage summary
        if: always()
        run: |
          {
            echo "## Coverage summary"
            echo '```'
            pnpm exec c8 report --reporter=text 2>/dev/null | tail -n 8
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # actions/upload-artifact v4 — pinned SHA
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: coverage
          path: coverage/coverage-summary.json

  # F-4: macOS does not ship util-linux flock; exercise portable daemon admission.
  daemon-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "26.11.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # D9 Phase F: exercise portable mkdir-lock admission, successor publication,
      # real process crash/recovery and approval/continuation authority on macOS.
      # Keep this a required job; a Linux pass is not a substitute for macOS evidence.
      - name: Daemon admission, stop/restart and successor publication
        timeout-minutes: 8
        run: |
          node --test --test-isolation=none \
            dist/tests/daemon/daemon-manager.test.js \
            dist/tests/daemon/daemon-stop-publication.test.js
      - name: Continuation authority, process races and SIGKILL recovery
        timeout-minutes: 12
        run: |
          node --test --test-isolation=none \
            dist/tests/security/d9-process-races.test.js \
            dist/tests/security/d9-resumer-sigkill.test.js
      - name: Focused continuation security acceptance
        timeout-minutes: 8
        run: |
          ./node_modules/.bin/vitest run --configLoader native --config vitest.config.mts \
            --pool=forks --maxWorkers=1 \
            tests/security/daemon-tool-continuation-acceptance.vitest.ts \
            tests/security/worker-approval-port.vitest.ts \
            tests/security/continuation-cancellation.vitest.ts \
            tests/security/continuation-unknown-outcome.vitest.ts
