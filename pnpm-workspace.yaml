packages:
  - "packages/*"

saveExact: true
strictPeerDependencies: false
autoInstallPeers: true
sharedWorkspaceLockfile: true
# Scoped to test-exclude only. test-exclude@8.0.0 (the latest release) still
# declares glob ^13.0.6 and minimatch ^10.2.2, which pull the vulnerable
# minimatch@10 / brace-expansion@5.0.9 line and carry four advisories:
#   GHSA-g3hv-75wg-m249  minimatch DoS via globparts amplification
#   GHSA-qhr7-859c-m2p7  brace-expansion DoS via uncontrolled recursion
#   GHSA-6j4f-fj2g-mc7p  brace-expansion DoS via parseCommaParts recursion
#   GHSA-q2hr-2g5m-vwhr  brace-expansion quadratic-time expansion
#   GHSA-3g3m-2fjr-6pw4  glob AbortSignal cancellation bypass
# There is no upstream release that fixes this, so the fixed lines are pinned
# here instead. The override is scoped to `test-exclude` rather than applied
# globally so no other consumer is silently moved off its declared range.
#
# Compatibility: test-exclude@8.0.0 only uses `minimatch(path, pattern, opts)`
# and `glob.sync` / `glob()`. Both are stable across minimatch 10 -> 11 and
# glob 13 -> 14. Verified by running the real coverage path (see
# docs/security/2026-10-31-dependency-advisory-remediation.md).
overrides:
  "test-exclude>glob": 14.0.3
  "test-exclude>minimatch": 11.0.3
allowBuilds:
  better-sqlite3: true
  esbuild: true
  # Explicitly DENIED, not approved. pnpm fails closed on any dependency whose
  # lifecycle script is neither approved nor denied, so migrating to
  # @huggingface/transformers (which pulls onnxruntime-node and protobufjs@7)
  # needs a recorded decision — and the decision here is "do not run it".
  #
  # protobufjs@7's postinstall only prints a version-scheme warning; it is
  # denied because ALiX gains nothing from running dependency scripts.
  #
  # onnxruntime-node's postinstall downloads CUDA/TensorRT provider libraries
  # from NuGet without an independently verified checksum or signature. CPU
  # inference does not need those: the package already ships
  # bin/napi-v6/<os>/<arch>/onnxruntime_binding.node and libonnxruntime.so.1.
  # Verified: `pnpm install --frozen-lockfile` succeeds and 384-dim CPU
  # inference runs offline with both scripts denied.
  #
  # Denying also keeps these out of security/lifecycle-script-allowlist.json,
  # which must only list scripts ALiX actually permits. Do not flip these to
  # `true` without a scoped supply-chain review of the NuGet download path.
  onnxruntime-node: false
  protobufjs: false
  # `sharp` is retained as an approval even though sharp@0.35.5 (pulled in by
  # @huggingface/transformers) no longer defines an install/postinstall script —
  # 0.32.6 did. It is an upstream native-image dependency, so leave the
  # approval in place rather than silently dropping a reviewed entry; revisit
  # when the allowlist entry is next renewed.
  sharp: true
minimumReleaseAgeExclude:
  - tsx@4.22.5
  - '@langfuse/client@5.11.1'
  - '@langfuse/core@5.11.1'
  - '@langfuse/otel@5.11.1'
  - '@langfuse/tracing@5.11.1'
