packages:
  - "packages/*"

saveExact: true
strictPeerDependencies: false
autoInstallPeers: true
sharedWorkspaceLockfile: true
allowBuilds:
  better-sqlite3: true
  esbuild: true
  protobufjs: true
  sharp: true
minimumReleaseAgeExclude:
  - tsx@4.22.5
  - '@langfuse/client@5.11.1'
  - '@langfuse/core@5.11.1'
  - '@langfuse/otel@5.11.1'
  - '@langfuse/tracing@5.11.1'
